<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 250px;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
      color: #ffffff;
    }
    #speed-display {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #ffcc00;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    button {
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #3a3a3a; }
    button:active { background: #4a4a4a; }
    .guide {
      background: #222222;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.6;
    }
    .guide strong { color: #ffcc00; }
    .guide div { margin-bottom: 4px; }
    .guide div:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>⚡ Speed Controller</h1>
  <div id="speed-display">⚡ Greitis: 1.00x</div>
  <div class="buttons">
    <button id="btn-slower">Sulėtinti (-0.1)</button>
    <button id="btn-reset">Atstatyti (1.0x)</button>
    <button id="btn-faster">Pagreitinti (+0.1)</button>
  </div>
  <div class="guide">
    <div><strong>S</strong> — Sulėtinti greitį 0.1x žingsniu.</div>
    <div><strong>D</strong> — Pagreitinti greitį 0.1x žingsniu.</div>
    <div><strong>R</strong> — Atstatyti greitį į normalų (1.0x).</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
