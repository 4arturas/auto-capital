<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 230px;
      margin: 0;
      padding: 14px;
      background: #14171a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13px;
      color: #e2e8f0;
    }
    .pro-pill {
      display: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #090d16;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }
    .pro-pill.visible { display: inline-block; }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge, .icon-toggle {
      background: #1e293b;
      color: #10b981;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid #065f46;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-toggle {
      color: #94a3b8;
      border-color: #334155;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s;
    }
    .icon-toggle:hover {
      color: #f8fafc;
      border-color: #64748b;
    }
    .icon-toggle.active {
      background: #10b981;
      color: #052e16;
      border-color: #10b981;
    }
    .icon-toggle.pro-key {
      color: #fbbf24;
      border-color: #78350f;
    }
    .icon-toggle.pro-key.active {
      background: #f59e0b;
      color: #090d16;
      border-color: #f59e0b;
    }
    .preview-box {
      background: #1e2328;
      border: 1px solid #2d343c;
      border-radius: 10px;
      padding: 13px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 10px;
    }
    .count {
      font-size: 26px;
      font-weight: 800;
      color: #10b981;
      line-height: 1;
    }
    .count-total {
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
    }
    .rows-icon {
      color: #64748b;
      width: 19px;
      height: 19px;
    }
    .limit-banner {
      display: none;
      width: 100%;
      margin-bottom: 10px;
      padding: 7px 10px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid #92400e;
      border-radius: 8px;
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.15s;
    }
    .limit-banner:hover { background: rgba(245, 158, 11, 0.2); }
    .limit-banner.visible { display: flex; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s, opacity 0.15s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-csv {
      background: #10b981;
      color: #052e16;
    }
    .btn-csv:hover:not(:disabled) { background: #34d399; }
    .btn-copy {
      background: #262c34;
      color: #e2e8f0;
      border: 1px solid #374151;
    }
    .btn-copy:hover:not(:disabled) { background: #323943; }
    svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* PRO License Panel */
    .pro-panel {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #1a1f24;
      border: 1px solid #78350f;
      border-radius: 8px;
      flex-direction: column;
      gap: 8px;
    }
    .pro-panel.visible { display: flex; }
    .pro-input-row {
      display: flex;
      gap: 6px;
    }
    .pro-input {
      flex: 1;
      background: #111417;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      color: #f8fafc;
      font-size: 11px;
      font-family: monospace;
      outline: none;
    }
    .pro-input:focus { border-color: #f59e0b; }
    .btn-verify {
      background: #f59e0b;
      color: #090d16;
      border: none;
      border-radius: 6px;
      padding: 0 10px;
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-buy {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      padding: 7px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #090d16;
      text-decoration: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
    }
    .pro-status {
      font-size: 10px;
      text-align: center;
      color: #94a3b8;
    }

    /* Help Panel */
    .help-panel {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #1a1f24;
      border: 1px solid #2d343c;
      border-radius: 8px;
      font-size: 11px;
      color: #cbd5e1;
      flex-direction: column;
      gap: 7px;
    }
    .help-panel.visible { display: flex; }
    .help-row {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.25;
    }
    .help-icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: #262c34;
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 10px;
    }
    .help-icon svg { width: 13px; height: 13px; }
  </style>
</head>
<body>
<div class="header">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M3 15h18M12 9v12"/>
    </svg>
    <span>Easy Scraper</span>
    <span class="pro-pill" id="pro-pill">PRO</span>
  </div>
  <div class="header-controls">
    <div class="badge" id="mode-badge"></div>
    <button class="icon-toggle pro-key" id="btn-pro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
      </svg>
    </button>
    <button class="icon-toggle" id="btn-help">?</button>
  </div>
</div>

<div class="preview-box">
  <svg class="rows-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="6" x2="21" y2="6"/>
    <line x1="8" y1="12" x2="21" y2="12"/>
    <line x1="8" y1="18" x2="21" y2="18"/>
    <line x1="3" y1="6" x2="3.01" y2="6"/>
    <line x1="3" y1="12" x2="3.01" y2="12"/>
    <line x1="3" y1="18" x2="3.01" y2="18"/>
  </svg>
  <div>
    <span class="count" id="row-count">...</span>
    <span class="count-total" id="row-total"></span>
  </div>
</div>

<!-- Shown when page has > 15 rows and user is on Free tier -->
<div class="limit-banner" id="limit-banner">
  <span id="limit-text">🔒 +0 rows</span>
  <span>PRO →</span>
</div>

<div class="actions">
  <button class="btn-csv" id="btn-csv">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span>CSV</span>
  </button>

  <button class="btn-copy" id="btn-copy">
    <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
  </button>
</div>

<!-- Toggleable PRO License Panel -->
<div class="pro-panel" id="pro-panel">
  <div class="pro-input-row">
    <input type="text" class="pro-input" id="pro-input" placeholder="XXXX-XXXX-XXXX" />
    <button class="btn-verify" id="btn-verify">✓</button>
  </div>
  <a href="https://gumroad.com" target="_blank" class="btn-buy" id="btn-buy">
    <span>🔓 Unlimited Rows — PRO</span>
  </a>
  <div class="pro-status" id="pro-status">Free limit: 15 rows / page</div>
</div>

<!-- Toggleable Help Panel -->
<div class="help-panel" id="help-panel">
  <div class="help-row">
    <div class="help-icon">#</div>
    <span id="help-rows"></span>
  </div>
  <div class="help-row">
    <div class="help-icon">CSV</div>
    <span id="help-csv"></span>
  </div>
  <div class="help-row">
    <div class="help-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </div>
    <span id="help-copy"></span>
  </div>
  <div class="help-row">
    <div class="help-icon" id="help-mode-icon"></div>
    <span id="help-mode"></span>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
