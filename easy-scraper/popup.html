<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 220px;
      margin: 0;
      padding: 14px;
      background: #14171a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 13px;
      color: #e2e8f0;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge, .help-toggle {
      background: #1e293b;
      color: #10b981;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid #065f46;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .help-toggle {
      color: #94a3b8;
      border-color: #334155;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      transition: all 0.15s;
    }
    .help-toggle:hover {
      color: #f8fafc;
      border-color: #64748b;
    }
    .help-toggle.active {
      background: #10b981;
      color: #052e16;
      border-color: #10b981;
    }
    .preview-box {
      background: #1e2328;
      border: 1px solid #2d343c;
      border-radius: 10px;
      padding: 14px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .count {
      font-size: 28px;
      font-weight: 800;
      color: #10b981;
      line-height: 1;
    }
    .rows-icon {
      color: #64748b;
      width: 20px;
      height: 20px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 40px;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s, opacity 0.15s;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-csv {
      background: #10b981;
      color: #052e16;
    }
    .btn-csv:hover:not(:disabled) { background: #34d399; }
    .btn-copy {
      background: #262c34;
      color: #e2e8f0;
      border: 1px solid #374151;
    }
    .btn-copy:hover:not(:disabled) { background: #323943; }
    svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* Help Panel (Toggled via ? button) */
    .help-panel {
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #1a1f24;
      border: 1px solid #2d343c;
      border-radius: 8px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .help-panel.visible {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .help-row {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.25;
    }
    .help-icon {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background: #262c34;
      color: #10b981;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 10px;
    }
    .help-icon svg { width: 13px; height: 13px; }
  </style>
</head>
<body>
<div class="header">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M3 15h18M12 9v12"/>
    </svg>
    <span>Easy Scraper</span>
  </div>
  <div class="header-controls">
    <div class="badge" id="mode-badge"></div>
    <button class="help-toggle" id="btn-help">?</button>
  </div>
</div>

<div class="preview-box">
  <svg class="rows-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="8" y1="6" x2="21" y2="6"/>
    <line x1="8" y1="12" x2="21" y2="12"/>
    <line x1="8" y1="18" x2="21" y2="18"/>
    <line x1="3" y1="6" x2="3.01" y2="6"/>
    <line x1="3" y1="12" x2="3.01" y2="12"/>
    <line x1="3" y1="18" x2="3.01" y2="18"/>
  </svg>
  <div class="count" id="row-count">...</div>
</div>

<div class="actions">
  <button class="btn-csv" id="btn-csv">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span>CSV</span>
  </button>

  <button class="btn-copy" id="btn-copy">
    <svg id="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="9" width="13" height="13" rx="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
  </button>
</div>

<div class="help-panel" id="help-panel">
  <div class="help-row">
    <div class="help-icon">#</div>
    <span id="help-rows"></span>
  </div>
  <div class="help-row">
    <div class="help-icon">CSV</div>
    <span id="help-csv"></span>
  </div>
  <div class="help-row">
    <div class="help-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </div>
    <span id="help-copy"></span>
  </div>
  <div class="help-row">
    <div class="help-icon" id="help-mode-icon"></div>
    <span id="help-mode"></span>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
