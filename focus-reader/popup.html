<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 240px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fafafa;
      color: #1a1a1a;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      text-align: center;
      letter-spacing: -0.2px;
    }

    .toggle-btn {
      width: 100%;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #1a1a1a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 16px;
    }

    .toggle-btn:hover {
      background: #333;
    }

    .toggle-btn.active {
      background: #c0392b;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }

    .font-size-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .font-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      background: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .font-btn:hover {
      background: #ddd;
    }

    .theme-controls {
      display: flex;
      gap: 6px;
    }

    .theme-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 500;
      color: #1a1a1a;
      background: #eee;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .theme-btn:hover {
      background: #ddd;
    }

    .theme-btn.active {
      border-color: #1a1a1a;
    }

    .theme-btn[data-theme="light"] {
      background: #fff;
    }

    .theme-btn[data-theme="sepia"] {
      background: #f4ecd8;
    }

    .theme-btn[data-theme="dark"] {
      background: #1a1a1a;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>📖 Focus Reader</h1>

  <button class="toggle-btn" id="toggleBtn">Įjungti skaitymo režimą</button>

  <div class="section-label">Šrifto dydis</div>
  <div class="font-size-controls">
    <button class="font-btn" id="fontDecrease">A-</button>
    <button class="font-btn" id="fontIncrease">A+</button>
  </div>

  <div class="section-label">Spalvų tema</div>
  <div class="theme-controls">
    <button class="theme-btn active" data-theme="light">Baltas</button>
    <button class="theme-btn" data-theme="sepia">Sepia</button>
    <button class="theme-btn" data-theme="dark">Tamsus</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
